<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | TechPulse Innovations</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0D6FFD;--primary-dark:#0A58CA;--dark:#1E293B;--light:#F8FAFC;--muted:#526077;--border:#E2E8F0;--tint:#EAF3FF;--ok:#067647;--bad:#B42318;--radius:14px;--head:"Poppins",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--body);color:var(--dark);background:#F1F5F9;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}button{font-family:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.9rem;padding:10px 18px;border-radius:10px;border:2px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;transition:background .2s}
.btn:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.btn.ghost{background:#fff;color:var(--primary)}.btn.ghost:hover{background:var(--tint)}
.btn.danger{background:#fff;color:var(--bad);border-color:#F1B8B2}.btn.danger:hover{background:#FEF3F2}
.btn.sm{padding:6px 12px;font-size:.82rem}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border:1px solid var(--border);background:#fff;border-radius:8px;color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}.icon-btn.bad:hover{color:var(--bad);border-color:var(--bad)}
input{width:100%;padding:10px 12px;border:1px solid #CBD5E1;border-radius:10px;font:inherit;color:var(--dark);background:#fff}
input:focus{outline:3px solid rgba(13,111,253,.25);border-color:var(--primary)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:600;font-size:1.2rem}
.logo svg{width:32px;height:32px}
/* layout */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--dark);color:#CBD5E1;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.side .logo{color:#fff;padding:0 8px 24px}
.side nav{display:grid;gap:4px}
.nav-a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-weight:500;font-size:.93rem;color:#CBD5E1}
.nav-a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-a[aria-current="page"]{background:var(--primary);color:#fff}
.badge{margin-left:auto;background:#F04438;color:#fff;border-radius:99px;font-size:.72rem;font-weight:700;padding:1px 8px}
.side .bottom{margin-top:auto;display:grid;gap:4px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:14px 28px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top h1{font-family:var(--head);font-size:1.25rem;margin:0}
.top .spacer{flex:1}
.me{display:flex;align-items:center;gap:10px;font-size:.88rem;font-weight:500}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;font:600 .8rem var(--head);flex:none}
.menu-btn{display:none}
#view{padding:28px;outline:none}
/* cards */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h2{font-family:var(--head);font-size:1.05rem;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card h2 a{font:600 .82rem var(--body);color:var(--primary)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{display:flex;gap:14px;align-items:center}
.stat .ico{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.stat b{display:block;font:600 1.6rem var(--head);line-height:1.1}.stat span{font-size:.84rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem}.list li:last-child{border:0}
.list .grow{flex:1;min-width:0}.list .grow div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.list small{color:var(--muted)}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
/* users table */
.toolbar{display:flex;gap:10px;margin-bottom:16px}
.search{position:relative;flex:1;max-width:420px}.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px;min-width:200px}.who small{display:block;color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.s-active{background:#ECFDF3;color:var(--ok)}.s-suspended{background:#FEF3F2;color:var(--bad)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:.86rem;color:var(--muted);flex-wrap:wrap}.pager div{display:flex;gap:8px}
/* inbox */
.inbox{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
.msg-list{max-height:70vh;overflow:auto;padding:0}
.msg{display:flex;gap:12px;padding:14px;border:0;border-bottom:1px solid var(--border);cursor:pointer;width:100%;text-align:left;background:#fff}
.msg:hover{background:var(--light)}.msg.sel{background:var(--tint)}
.msg .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;background:transparent;flex:none}.msg.unread .dot{background:var(--primary)}
.msg.unread b{font-weight:700}.msg b{font-weight:500}.msg .grow{flex:1;min-width:0}
.msg .grow div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.msg small{color:var(--muted)}
.detail h2{display:block;font-size:1.2rem}.meta{color:var(--muted);font-size:.88rem;margin:0 0 16px}
.body{white-space:pre-wrap;background:var(--light);border-radius:10px;padding:16px;margin:16px 0;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px}
/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:20px;z-index:100}
.dialog{background:#fff;border-radius:var(--radius);padding:24px;width:min(440px,100%)}
.dialog h2{font-family:var(--head);font-size:1.2rem;margin:0 0 10px}
.dialog p{margin:0;color:var(--muted)}
.dialog .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:200}
.toast{background:var(--dark);color:#fff;padding:12px 18px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (max-width:1100px){.grid2,.inbox{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .25s}.side.open{transform:none}
 .menu-btn{display:inline-grid}.top{padding:12px 16px}#view{padding:16px}.me span{display:none}
}
@media (max-width:520px){.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
select{padding:8px 10px;border:1px solid #CBD5E1;border-radius:10px;font:inherit;color:var(--dark);background:#fff}
input[type=number]{width:84px}
.flist{list-style:none;margin:0;padding:0}.flist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem}.flist li:last-child{border:0}.flist a{color:var(--primary);text-decoration:underline;overflow-wrap:anywhere}.flist small{color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0D6FFD"/><path d="M8 9h16v5h-5.5v10h-5V14H8z" fill="#fff"/></svg> TechPulse</div>
    <nav aria-label="Admin">
      <a class="nav-a" href="#/" data-nav="overview" id="n-overview"></a>
      <a class="nav-a" href="#/users" data-nav="users" id="n-users"></a>
      <a class="nav-a" href="#/projects" data-nav="projects" id="n-projects"></a>
      <a class="nav-a" href="#/messages" data-nav="messages" id="n-messages"></a>
    </nav>
    <div class="bottom">
      <a class="nav-a" href="/" id="n-site"></a>
      <button class="nav-a" id="n-out" data-act="logout" type="button" style="background:none;border:0;cursor:pointer;text-align:left;width:100%"></button>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" data-act="menu" type="button" aria-label="Open menu" id="b-menu"></button>
      <h1 id="pageTitle">Overview</h1><span class="spacer"></span>
      <div class="me"><div class="avatar" id="meAv">A</div><span id="meName">Admin</span></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="overlay" id="overlay" hidden><div class="dialog" id="dlg" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* TechPulse Admin Dashboard. Opened at /admin; the server only serves this page to a logged-in admin.
   All data comes from the server API (/api/admin/...), which also checks the admin role on every request. */
const $=id=>document.getElementById(id),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o){o=o||{};const h={'X-Requested-With':'tp'};let b=o.body;if(b&&typeof b!=='string'){h['Content-Type']='application/json';b=JSON.stringify(b)}
  try{const r=await fetch('/api'+p,{method:o.method||'GET',headers:h,body:b,credentials:'same-origin'});let d={};try{d=await r.json()}catch(e){}
    if(r.status===401||r.status===403){location.href='/#/login';return{ok:false,status:r.status,data:d}}return{ok:r.ok,status:r.status,data:d}}
  catch(e){return{ok:false,status:0,data:{error:'Cannot reach the server.'}}}}
const I={
 dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
 proj:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
 trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
 menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
 reply:'<path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/>',
 ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 key:'<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/>',
 clip:'<path d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/>'
};
const ic=(k,c)=>'<svg class="ic'+(c?' '+c:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+I[k]+'</svg>';
const NAVI={overview:['dash','Overview'],users:['users','Users'],projects:['proj','Projects'],messages:['mail','Messages']};
Object.keys(NAVI).forEach(k=>{$('n-'+k).innerHTML=ic(NAVI[k][0])+'<span>'+NAVI[k][1]+'</span>'+(k==='messages'?'<span class="badge" id="unreadBadge" hidden>0</span>':'')});
$('n-site').innerHTML=ic('ext')+'<span>View website</span>';$('n-out').innerHTML=ic('out')+'<span>Sign out</span>';$('b-menu').innerHTML=ic('menu');

/* ---------- helpers + data ---------- */
const D={users:[],messages:[],projects:[],statuses:['Request sent','Planning','In design','In development','Testing','Completed']};
async function load(){const [u,m,p]=await Promise.all([api('/admin/users'),api('/admin/messages'),api('/admin/projects')]);
  if(u.ok)D.users=u.data.users;if(m.ok)D.messages=m.data.messages;if(p.ok){D.projects=p.data.projects;D.statuses=p.data.statuses}}
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const fmt=t=>t?new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const fmtD=t=>t?new Date(t).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):'-';
function ago(t){if(!t)return '';const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';return Math.floor(s/86400)+' d ago'}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('toasts').append(t);setTimeout(()=>t.remove(),3200)}
let PENDING=null;
function openModal(h){$('dlg').innerHTML=h;$('overlay').hidden=false}
function closeModal(){$('overlay').hidden=true;$('dlg').innerHTML='';PENDING=null}
function confirmBox(title,text,label,fn){PENDING=fn;openModal('<h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><div class="foot"><button class="btn ghost" data-act="close" type="button">Cancel</button><button class="btn danger" data-act="yes" type="button">'+esc(label)+'</button></div>');$('dlg').querySelector('.btn.danger').focus()}
const fail=r=>toast((r.data&&r.data.error)||'Something went wrong.');

/* ---------- state + router ---------- */
const S={q:'',page:1,msel:null};
const ROUTES={'/':'overview','/users':'users','/projects':'projects','/messages':'messages'};
let CUR=(location.hash||'').slice(1)||'/';
function go(to){CUR=to;try{if(location.hash.slice(1)!==to)location.hash=to}catch(e){}render()}
addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'/';if(h!==CUR){CUR=h;render()}});
function render(){const name=ROUTES[CUR]||'overview';
  $$('[data-nav]').forEach(a=>a.dataset.nav===name?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  $('pageTitle').textContent=NAVI[name][1];document.title=NAVI[name][1]+' | TechPulse Admin';$('side').classList.remove('open');
  ({overview:viewOverview,users:viewUsers,projects:viewProjects,messages:viewMessages})[name]();badge();window.scrollTo(0,0)}
function badge(){const n=D.messages.filter(m=>!m.read).length,b=$('unreadBadge');if(b){b.textContent=n;b.hidden=!n}}

/* ---------- Overview ---------- */
function viewOverview(){const U=D.users,M=D.messages,now=Date.now(),week=7*864e5;
  const newW=U.filter(u=>now-u.createdAt<week).length,unread=M.filter(m=>!m.read).length,active=D.projects.filter(p=>p.status!=='Completed').length;
  const card=(ico,n,l)=>'<div class="card stat"><div class="ico">'+ic(ico)+'</div><div><b>'+n+'</b><span>'+l+'</span></div></div>';
  const newest=U.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,5),latest=M.slice(0,5);
  $('view').innerHTML='<div class="stats">'+card('users',U.length,'Total users')+card('plus',newW,'New this week')+card('proj',active,'Active projects')+card('mail',unread,'Unread messages')+'</div>'
  +'<div class="grid2"><div class="card"><h2>Newest users <a href="#/users">View all</a></h2>'+(newest.length?'<ul class="list">'+newest.map(u=>'<li><div class="avatar">'+esc(ini(u.name))+'</div><div class="grow"><div><b>'+esc(u.name)+'</b></div><small>'+esc(u.email)+'</small></div><small>'+ago(u.createdAt)+'</small></li>').join('')+'</ul>':'<div class="empty">No users yet. People who sign up on the website appear here.</div>')+'</div>'
  +'<div class="card"><h2>Latest messages <a href="#/messages">Open inbox</a></h2>'+(latest.length?'<ul class="list">'+latest.map(m=>'<li><div class="avatar">'+esc(ini(m.name))+'</div><div class="grow"><div><b>'+esc(m.name)+'</b>'+(m.read?'':' <span class="chip" style="background:#EAF3FF;color:#0A58CA">New</span>')+'</div><small>'+esc(String(m.text||'').slice(0,70))+'</small></div><small>'+ago(m.t)+'</small></li>').join('')+'</ul>':'<div class="empty">No messages yet.</div>')+'</div></div>'}

/* ---------- Users ---------- */
function viewUsers(){
  $('view').innerHTML='<div class="toolbar"><div class="search">'+ic('search')+'<input type="search" placeholder="Search name or email" aria-label="Search users" id="uq" value="'+esc(S.q)+'"></div></div><div class="card" id="uTable"></div>';
  $('uq').addEventListener('input',e=>{S.q=e.target.value;S.page=1;drawUsers()});drawUsers()}
function drawUsers(){const q=S.q.trim().toLowerCase(),size=10,L=D.users.filter(u=>!q||(u.name+' '+u.email).toLowerCase().includes(q)).sort((a,b)=>b.createdAt-a.createdAt),pages=Math.max(1,Math.ceil(L.length/size));
  S.page=Math.min(S.page,pages);const rows=L.slice((S.page-1)*size,S.page*size),a=L.length?(S.page-1)*size+1:0,b=Math.min(L.length,S.page*size);
  $('uTable').innerHTML=rows.length?'<div class="tbl-wrap"><table><thead><tr><th>Username</th><th>Email</th><th>Password</th><th>Last login</th><th>Joined</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead><tbody>'
  +rows.map(u=>{const sus=u.status==='suspended';
   return '<tr><td><div class="who"><div class="avatar">'+esc(ini(u.name))+'</div><div>'+esc(u.name)+'</div></div></td><td>'+esc(u.email)+'</td>'
   +'<td><span title="Passwords are stored encrypted and cannot be viewed. Use Reset to set a new one." style="letter-spacing:2px;color:var(--muted)">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</span> <button class="btn ghost sm" data-act="resetPw" data-id="'+u.id+'" type="button">'+ic('key','sm')+' Reset</button></td>'
   +'<td>'+(u.lastLogin?fmt(u.lastLogin):'Never')+'</td><td>'+fmtD(u.createdAt)+'</td><td><span class="chip s-'+(sus?'suspended':'active')+'">'+(sus?'Suspended':'Active')+'</span></td>'
   +'<td><div class="actions"><button class="btn ghost sm" data-act="files" data-id="'+u.id+'" type="button">'+ic('clip','sm')+' Files ('+u.files+')</button><button class="btn ghost sm" data-act="toggle" data-id="'+u.id+'" type="button">'+(sus?'Activate':'Suspend')+'</button><button class="icon-btn bad" data-act="del" data-id="'+u.id+'" type="button" title="Delete" aria-label="Delete '+esc(u.name)+'">'+ic('trash','sm')+'</button></div></td></tr>'}).join('')
  +'</tbody></table></div><div class="pager"><span>Showing '+a+'-'+b+' of '+L.length+'</span><div><button class="btn ghost sm" data-act="prev" type="button" '+(S.page<=1?'disabled':'')+'>Previous</button><button class="btn ghost sm" data-act="next" type="button" '+(S.page>=pages?'disabled':'')+'>Next</button></div></div>'
  :'<div class="empty">'+(D.users.length?'No users match your search.':'No users yet. People who sign up on the website appear here.')+'</div>'}

/* ---------- Projects ---------- */
function viewProjects(){
  $('view').innerHTML='<div class="card" id="pTable">'+(D.projects.length?'<div class="tbl-wrap"><table><thead><tr><th>Client</th><th>Project</th><th>Status</th><th>Progress %</th><th style="text-align:right">Actions</th></tr></thead><tbody>'
  +D.projects.map(p=>'<tr data-pid="'+p.id+'"><td><div class="who"><div class="avatar">'+esc(ini(p.userName))+'</div><div>'+esc(p.userName)+'<small>'+esc(p.userEmail)+'</small></div></div></td><td>'+esc(p.name)+'</td>'
   +'<td><select class="p-status" aria-label="Status">'+D.statuses.map(s=>'<option'+(s===p.status?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select></td><td><input class="p-pct" type="number" min="0" max="100" value="'+p.pct+'" aria-label="Progress percent"></td>'
   +'<td><div class="actions"><button class="btn sm" data-act="saveProj" data-id="'+p.id+'" type="button">Save</button><button class="icon-btn bad" data-act="delProj" data-id="'+p.id+'" type="button" title="Delete" aria-label="Delete project">'+ic('trash','sm')+'</button></div></td></tr>').join('')+'</tbody></table></div>'
  :'<div class="empty">No projects yet. When a client uses &ldquo;Request a new project&rdquo; on the website, it appears here and on their dashboard.</div>')+'</div>'}

/* ---------- Messages ---------- */
function viewMessages(){$('view').innerHTML='<div class="inbox"><div class="card msg-list" id="mList"></div><div class="card detail" id="mDetail"></div></div>';drawMessages()}
function drawMessages(){const M=D.messages;if(!M.find(m=>m.id===S.msel))S.msel=null;
  $('mList').innerHTML=M.length?M.map(m=>'<button class="msg '+(m.read?'':'unread')+(m.id===S.msel?' sel':'')+'" data-act="selmsg" data-id="'+m.id+'" type="button"><span class="dot"></span><span class="grow"><div><b>'+esc(m.name)+'</b></div><div>'+esc(m.topic||'General question')+'</div><div><small>'+esc(String(m.text||'').slice(0,60))+'</small></div></span><small>'+ago(m.t)+'</small></button>').join(''):'<div class="empty">No messages yet. Messages from the website contact form appear here.</div>';
  const m=M.find(x=>x.id===S.msel);
  $('mDetail').innerHTML=m?'<h2>'+esc(m.topic||'General question')+'</h2><p class="meta">From <b>'+esc(m.name)+'</b> &lt;'+esc(m.email)+'&gt; &middot; '+fmt(m.t)+'</p><div class="body">'+esc(m.text)+'</div>'
   +'<div class="row"><a class="btn" href="mailto:'+esc(m.email)+'?subject='+encodeURIComponent('Re: '+(m.topic||'Your inquiry to TechPulse'))+'">'+ic('reply','sm')+' Reply by email</a><button class="btn danger" data-act="delMsg" data-id="'+m.id+'" type="button">'+ic('trash','sm')+' Delete</button></div>'
   :'<div class="empty">Select a message to read it.</div>'}

/* ---------- actions ---------- */
const user=id=>D.users.find(u=>u.id===id);
async function reload(){await load();render2()}
function render2(){const n=ROUTES[CUR]||'overview';({overview:viewOverview,users:drawUsers,projects:viewProjects,messages:drawMessages})[n]();badge()}
const ACT={
 async logout(){await api('/logout',{method:'POST'});location.href='/'},
 menu(){$('side').classList.toggle('open')},
 close(){closeModal()},
 yes(){const f=PENDING;closeModal();if(f)f()},
 prev(){S.page=Math.max(1,S.page-1);drawUsers()},next(){S.page++;drawUsers()},
 async toggle(d){const u=user(d.id);if(!u)return;const st=u.status==='suspended'?'active':'suspended',r=await api('/admin/users/'+u.id,{method:'PATCH',body:{status:st}});if(!r.ok)return fail(r);toast(u.name+' is now '+st+'.');await reload()},
 del(d){const u=user(d.id);if(!u)return;confirmBox('Delete user?','This permanently deletes '+u.name+' ('+u.email+'), their projects and their files.','Delete user',async()=>{const r=await api('/admin/users/'+u.id,{method:'DELETE'});if(!r.ok)return fail(r);toast('User deleted.');await reload()})},
 resetPw(d){const u=user(d.id);if(!u)return;openModal('<h2>Reset password</h2><p style="margin-bottom:14px">Set a new password for '+esc(u.name)+' ('+esc(u.email)+'). They will be logged out. Give the new password to them privately.</p><input id="m-pw" type="text" autocomplete="off" placeholder="New password (at least 8 characters)"><p id="mErr" role="alert" style="color:var(--bad);font-size:.85rem;min-height:1.1em;margin-top:6px"></p><div class="foot"><button class="btn ghost" data-act="close" type="button">Cancel</button><button class="btn" data-act="savePw" data-id="'+u.id+'" type="button">Save password</button></div>');$('m-pw').focus()},
 async savePw(d){const p=$('m-pw').value;if(p.length<8){$('mErr').textContent='Use at least 8 characters.';return}const r=await api('/admin/users/'+d.id+'/password',{method:'POST',body:{password:p}});if(!r.ok){$('mErr').textContent=(r.data&&r.data.error)||'Could not save.';return}closeModal();toast('Password updated.')},
 async files(d){const u=user(d.id);if(!u)return;const r=await api('/admin/users/'+u.id+'/files');if(!r.ok)return fail(r);const L=r.data.files;
  openModal('<h2>Files from '+esc(u.name)+'</h2>'+(L.length?'<ul class="flist">'+L.map(f=>'<li><a href="/api/files/'+f.id+'">'+esc(f.name)+'</a><small>'+(f.size/1024).toFixed(1)+' KB &middot; '+fmtD(f.t)+'</small></li>').join('')+'</ul>':'<p>No files shared yet.</p>')+'<div class="foot"><button class="btn ghost" data-act="close" type="button">Close</button></div>')},
 async saveProj(d){const tr=document.querySelector('tr[data-pid="'+d.id+'"]'),r=await api('/admin/projects/'+d.id,{method:'PATCH',body:{status:tr.querySelector('.p-status').value,pct:tr.querySelector('.p-pct').value}});if(!r.ok)return fail(r);toast('Project updated.');await reload()},
 delProj(d){confirmBox('Delete project?','This removes the project from the client\'s dashboard.','Delete',async()=>{const r=await api('/admin/projects/'+d.id,{method:'DELETE'});if(!r.ok)return fail(r);toast('Project deleted.');await reload()})},
 async selmsg(d){S.msel=d.id;const m=D.messages.find(x=>x.id===d.id);if(m&&!m.read){m.read=true;api('/admin/messages/'+m.id,{method:'PATCH',body:{read:true}})}badge();drawMessages()},
 delMsg(d){confirmBox('Delete message?','This message will be permanently deleted.','Delete',async()=>{const r=await api('/admin/messages/'+d.id,{method:'DELETE'});if(!r.ok)return fail(r);S.msel=null;toast('Message deleted.');await reload()})}
};
document.addEventListener('click',e=>{
  const a=e.target.closest&&e.target.closest('a[href^="#/"]');if(a){e.preventDefault();go(a.getAttribute('href').slice(1));return}
  if(e.target===$('overlay')){closeModal();return}
  const b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b.dataset)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeModal()});

/* ---------- start ---------- */
(async()=>{const me=await api('/me');if(me.ok){$('meName').textContent=me.data.user.name;$('meAv').textContent=ini(me.data.user.name)}
  await load();render();
  setInterval(async()=>{if(!$('overlay').hidden)return;const el=document.activeElement;if(el&&(el.tagName==='INPUT'||el.tagName==='SELECT'))return;await load();render2()},8000)})();
</script>
</body>
</html>
